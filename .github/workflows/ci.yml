name: Software Architect Studio CI
on:
  push:
    branches: ["master", "work", "audit/implement-audit-v0.8.0"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sas-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-and-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      # Official release tag refs resolved through read-only Git on 2026-10-30.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: python -m pip install --only-binary=:all: --require-hashes -r requirements-validation.lock
        name: Install hash-locked validation wheels
      - run: python tools/check_source_manifest.py --check
        name: Verify package inventory and version correspondence
      - run: python tools/check_release.py --output /tmp/studio-verification.json --require-node
        name: Run Python regressions and Node conformance
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: local-toolkit-verification
          path: /tmp/studio-verification.json
          if-no-files-found: warn
          retention-days: 14
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: tests/browser
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - run: npm test
        working-directory: tests/browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure-traces
          path: tests/browser/test-results
          if-no-files-found: warn
          retention-days: 7
