name: Software Architect Studio CI
on:
  push:
    branches: ["master", "audit/implement-audit-v0.8.0"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sas-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-and-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-validation.txt
        name: Install pinned validation dependencies
      - run: python -m unittest discover -s tests -v
        name: Python regression suite
      - run: node tests/test_workbench.cjs
        name: Workbench core and DOM-model tests
      - run: python tools/check_source_manifest.py --check
        name: Verify package SHA-256 inventory
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
        working-directory: tests/browser
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - run: npm test
        working-directory: tests/browser
